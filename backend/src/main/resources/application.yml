spring:
  application:
    name: theragift-backend
  profiles:
    active: postgres

  jackson:
    date-format: yyyy-MM-dd
    time-zone: Europe/Istanbul

server:
  port: 8080

theragift:
  jwt:
    secret: "theragift-super-secret-key-change-in-production-2026-please"
    expiration-ms: 86400000 # 24 saat
  cors:
    allowed-origins: "http://localhost:5173"

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/theragift_db
    username: theragift
    password: theragift123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:theragift_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
