services:
  postgres:
    image: postgres:16-alpine
    container_name: theragift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: theragift_db
      POSTGRES_USER: theragift
      POSTGRES_PASSWORD: theragift123
    ports:
      - "5432:5432"
    volumes:
      - theragift_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theragift -d theragift_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  theragift_pgdata:
